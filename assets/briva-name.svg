<svg width="1200" height="180" viewBox="0 0 1200 180"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="redText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a0000"/>
      <stop offset="45%" stop-color="#ff1a1a"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#5a0000"/>
      
      <animate
        attributeName="x1"
        values="-100%;100%;-100%"
        dur="1.8s"
        repeatCount="indefinite"/>
      
      <animate
        attributeName="x2"
        values="0%;200%;0%"
        dur="1.8s"
        repeatCount="indefinite"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <rect width="1200" height="180" fill="transparent"/>

  <text
    x="600"
    y="120"
    text-anchor="middle"
    font-family="monospace"
    font-size="92"
    font-weight="700"
    letter-spacing="12"
    fill="url(#redText)"
    filter="url(#softGlow)">
    BRIVA PURI
  </text>

</svg>
